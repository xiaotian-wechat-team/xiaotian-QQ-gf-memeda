name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Create demo configuration
        run: cp config.example.json config.json
      - name: Run tests
        run: python -m pytest -q
      - name: Run OneBot self-test
        run: python tools/onebot_qq_run.py --self-test
      - name: Run local Mock OneBot demo
        run: ./scripts/demo_onebot.sh
        env:
          PYTHON: python
